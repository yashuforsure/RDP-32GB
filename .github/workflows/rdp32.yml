name: RDP-32GB

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tailscale Auth Key (must start with tskey-auth-)'
        required: true
        default: ''

jobs:
  rdp-32gb:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Optimize & Expand Virtual Memory to 32GB
        run: |
          Write-Host "Configuring 32GB Total Memory Pool (Physical + NVMe Pagefile)..."
          $system = Get-CimInstance Win32_ComputerSystem
          $system.AutomaticManagedPagefile = $false
          Set-CimInstance -InputObject $system

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'PagingFiles' -Value @("C:\pagefile.sys 16384 32768")

          $os = Get-CimInstance Win32_OperatingSystem
          $totalRam = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $totalVirtual = [math]::Round($os.TotalVirtualMemorySize / 1MB, 2)
          Write-Host "Physical RAM        : $totalRam GB"
          Write-Host "Total Memory Pool   : $totalVirtual GB"

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and configure security
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Firewall configuration
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Simple Password
        run: |
          $password = "Yashu@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          Write-Host "Created user RDP with password: $password"

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale via Chocolatey..."
          choco install tailscale -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              Write-Error "Tailscale binary not found at $tsPath"
              exit 1
          }
          Write-Host "Tailscale installed successfully."

      - name: Establish Tailscale Connection
        env:
          TS_INPUT_KEY: ${{ github.event.inputs.tailscale_key }}
          TS_SECRET_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $authKey = $env:TS_INPUT_KEY
          if (-not $authKey) {
              $authKey = $env:TS_SECRET_KEY
          }
          if (-not $authKey) {
              Write-Error "CRITICAL: Tailscale Auth Key is missing! Please provide it in the 'Run workflow' box."
              exit 1
          }

          $authKey = $authKey.Trim()
          if ($authKey -like "tskey-api-*") {
              Write-Error "ERROR: You provided an API Key! Tailscale needs an AUTH KEY (starts with tskey-auth-). Go to https://login.tailscale.com/admin/settings/keys and click 'Generate auth key'."
              exit 1
          }

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          Write-Host "Authenticating with Tailscale..."
          $upOutput = & $tsPath up --authkey=$authKey --hostname="gh-rdp32-$env:GITHUB_RUN_ID" 2>&1
          Write-Host $upOutput
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed. Please ensure you are using a valid Auth Key from https://login.tailscale.com/admin/settings/keys."
              exit 1
          }
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $rawIp = & $tsPath ip -4 2>$null
              if ($rawIp) {
                  $tsIP = $rawIp.ToString().Trim()
                  if ($tsIP) { break }
              }
              Start-Sleep -Seconds 4
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Warning "TCP test to Tailscale IP timed out, checking localhost..."
              $localTest = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
              if (-not $localTest.TcpTestSucceeded) {
                  Write-Error "TCP connection to RDP port 3389 failed"
                  exit 1
              }
          }
          Write-Host "TCP connectivity verified!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=========================================="
          Write-Host "             32GB RDP ONLINE              "
          Write-Host "=========================================="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "Memory   : 32 GB Available Memory Pool"
          Write-Host "==========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 32GB RDP Active - Runner is running..."
              Start-Sleep -Seconds 300
          }
